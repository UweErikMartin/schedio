name: build
run-name: build ${{github.repository}} by ${{github.actor}}
on: [push]

permissions:
  contents: read
  packages: write

jobs:
  Build_Multiplatform_Image:
    # The compile environment is only available for linux/amd64.
    # runs-on: [test]
    runs-on: [ubuntu-latest]

    steps:
    - name: Perform Checkout
      uses: actions/checkout@v4
   
    - name: Set Environment Variables
      run: |
        sed -En 's/^go (.*)$/GO_VERSION=\1/p' go.mod | tee -a $GITHUB_ENV
        sed -En 's/^.*=([0-9]*.[0-9]*.[0-9]*|latest)$/VERSION=\1/p' VERSION | tee -a $GITHUB_ENV
        echo '${{github.repository}}' | sed -E 's/.*/IMAGENAME=\L&/' | tee -a $GITHUB_ENV
        echo '${{github.repository}}' | sed -E 's#^.*/([^/]+)$#OUTFILE=\L\1#' | tee -a $GITHUB_ENV

    - name: Setup Golang
      uses: actions/setup-go@v5 
      with:
        go-version: ${{env.GO_VERSION}}

    - name: Test Golang
      run: |
        go test ./...

    - name: Login to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{github.actor}}
        password: ${{secrets.GITHUB_TOKEN}}

    - name: Setup Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and push
      uses: docker/build-push-action@v6
      with:
        platforms: linux/amd64, linux/arm64
        build-args: |
          GO_VERSION=${{env.GO_VERSION}}
          OUTFILE=${{env.OUTFILE}}
        push: true
        file: ./Dockerfile
        tags: ghcr.io/${{env.IMAGENAME}}:${{env.VERSION}}

    - name: Install Helm
      uses: azure/setup-helm@v4

    - name: Package and push Helm chart
      run: |
        OWNER=$(echo '${{github.repository_owner}}' | tr '[:upper:]' '[:lower:]')
        helm package ./deploy/helm/schedio \
          --version ${{env.VERSION}} \
          --app-version ${{env.VERSION}} \
          --destination /tmp
        helm registry login ghcr.io \
          --username ${{github.actor}} \
          --password ${{secrets.GITHUB_TOKEN}}
        helm push /tmp/schedio-${{env.VERSION}}.tgz oci://ghcr.io/${OWNER}
